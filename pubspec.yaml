name: live_tv_app
description: "A Globe TV-style free live TV streaming app powered by IPTV-org."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.8.0
  chewie: ^1.7.0
  http: ^1.1.0
  provider: ^6.1.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
